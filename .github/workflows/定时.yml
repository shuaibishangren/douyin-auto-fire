name: 定时跑代码
on:
  schedule:
    - cron: "0 12 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6  # 升级到支持 Node 24 的版本
      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 装依赖
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: 跑脚本
        run: python main.py  # ⚠️ 确认你的脚本真的叫 main.py，不是就改掉！
